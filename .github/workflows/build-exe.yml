name: Build Windows Executable

# Builds the self-contained dashboard executable on a Windows runner
# (PyInstaller cannot cross-compile from Linux/macOS). The resulting
# disasters.exe is uploaded as a build artifact, and attached to the
# release when the workflow runs for a tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller disasters.spec --noconfirm

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: disasters-windows
          path: dist/disasters.exe

      - name: Attach executable to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/disasters.exe
